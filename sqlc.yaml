version: "2"
sql:
  - engine: sqlite
    schema: internal/database/sqlite/migrations
    queries:
      - internal/database/queries/catalog.sql
      - internal/database/queries/delete_catalog.sql
      - internal/database/queries/write_queue.sql
      - internal/database/queries/write_queue_upsert.sql
      - internal/database/queries/managed.sql
      - internal/database/queries/managed_paths.sql
    gen:
      go:
        package: dbsql
        out: internal/database/sqlite/dbsql
  - engine: postgresql
    schema: internal/database/postgres/migrations
    queries:
      - internal/database/queries/catalog.sql
      - internal/database/queries/delete_catalog.sql
      - internal/database/queries/write_queue.sql
      - internal/database/queries/write_queue_upsert.sql
      - internal/database/queries/managed.sql
      - internal/database/queries/managed_paths_postgres.sql
    gen:
      go:
        package: pgsql
        out: internal/database/postgres/pgsql
  - engine: mysql
    schema: internal/database/mysql/migrations
    queries:
      - internal/database/queries/catalog.sql
      - internal/database/queries/delete_catalog_mysql.sql
      - internal/database/queries/write_queue.sql
      - internal/database/queries/write_queue_upsert_mysql.sql
      - internal/database/queries/managed.sql
      - internal/database/queries/managed_paths_mysql.sql
    gen:
      go:
        package: mysqlsql
        out: internal/database/mysql/mysqlsql
  - engine: sqlite
    schema: internal/database/sqlite/legacy/schema.sql
    queries: internal/database/sqlite/legacy/queries.sql
    gen:
      go:
        package: legacydbsql
        out: internal/database/sqlite/legacy/legacydbsql
        omit_unused_structs: true
